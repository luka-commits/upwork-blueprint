        <section class="panel"><h3>${j.status === 'won' ? 'The project' : 'Job details'}</h3><dl class="fields">
          ${field('Budget', budgetText(j))}${field('Posted', j.posted_date ? `${day(j.posted_date)} (${ago(j.posted_date)})` : '')}
          ${field('Engagement', [j.engagement || d.engagement_type, d.experience_level && String(d.experience_level).toLowerCase()].filter(Boolean).join(' · '))}
          ${field('Skills', (j.skills || []).join(', '))}${j.status === 'won' ? field('Client since', day(wonAt(j))) : ''}</dl>
          ${flags(j) ? `<p style="margin:10px 0 0">${flags(j)}</p>` : ''}
          ${j.rationale ? `<h4>Why this job</h4><p style="font-size:13.5px;margin:0">${esc(j.rationale)}</p>` : ''}
          ${j.summary ? `<h4>What they want</h4><p style="font-size:13.5px;margin:0">${esc(j.summary)}</p>` : ''}
          ${d.description ? `<details><summary style="margin-top:12px;font-weight:600;color:var(--brand)">The full posting</summary><div class="posting">${esc(d.description)}</div></details>` : ''}
        </section>
        <section class="panel"><h3>Client</h3><dl class="fields">
          ${field('Rating', c.rating ? `${c.rating}★ from ${c.reviews ?? '?'} reviews` : '')}
          ${field('Hires', c.hires != null ? `${c.hires}${c.posted_jobs != null ? ` of ${c.posted_jobs} jobs posted` : ''}` : c.posted_jobs != null ? `${c.posted_jobs} jobs posted` : '')}
          ${field('Spent', (d.client_record || {}).spend_total ? money(d.client_record.spend_total) : c.spent ? money(c.spent) : '')}
          ${field('Payment', c.verified ? 'verified' : c.verified === false ? 'not verified' : '')}
          ${field('Location', [d.client_city, c.country].filter(Boolean).join(', '))}${field('Time zone', d.client_timezone)}</dl>
          ${j.status === 'new' ? `<h4>Top slot</h4>${boostBlock(d)}` : ''}</section>
      </div>
      <section class="panel convo">
        <div class="convo-tabs"><button data-convo="conversation" aria-pressed="${convoTab === 'conversation'}">Conversation</button><button data-convo="timeline" aria-pressed="${convoTab === 'timeline'}">Timeline</button></div>
        <div class="convo-body" id="convoBody">${convoTab === 'timeline' ? timeline(j) : conversation(j)}</div>
        <div class="composer">
          <div class="composer-row"><input id="noteText" placeholder="Add a note to the timeline: a call, a promise, what they said" aria-label="Note"><button data-note="${esc(j.id)}">Add note</button></div>
          <div class="composer-row">${state.commands.reply ? `<button data-run="reply" data-job="${esc(j.id)}">Draft a reply</button>` : ''}
            <span class="note-sm">Nothing is sent from here. Replies are drafted by /reply and go out on Upwork only after your yes.</span></div>
        </div>
      </section>
      <div>
        <section class="panel"><h3>${j.status === 'won' ? 'Client' : 'Next step'}</h3>${nextStep(j)}
          ${CLOSED.includes(j.status) ? '' : `<div class="inline-form"><label for="followDate" class="note-sm">Follow up on</label><input type="date" id="followDate" value="${esc(j.next_follow_up || '')}"><button data-follow-save="${esc(j.id)}">Save</button></div>`}</section>
        <section class="panel"><h3>Tasks</h3>${tasksBlock(j)}</section>
        <section class="panel"><h3>Video</h3>${emb ? `<div class="video"><iframe src="${esc(emb)}" allowfullscreen title="Video for this job"></iframe></div>` : '<p class="note-sm" style="margin:0">Record your Loom over the pitch page, then paste the share link here.</p>'}
          <div class="inline-form"><input id="videoUrl" placeholder="https://www.loom.com/share/…" value="${esc(j.video || '')}" aria-label="Video link"><button data-video="${esc(j.id)}">Save</button>${j.video ? `<button data-video-clear="${esc(j.id)}" title="Remove the link">✕</button>` : ''}</div></section>
        <section class="panel"><h3>Pitch page</h3>${files.includes('pitch.html') ? `<div class="preview"><iframe src="/jobs/${esc(j.id)}/pitch.html" title="Pitch page preview" loading="lazy"></iframe></div>
          <div class="actions" style="margin-top:10px"><a class="btn" href="/jobs/${esc(j.id)}/pitch.html" target="_blank" rel="noopener">Open pitch page</a></div>`
          : `<p class="note-sm" style="margin:0 0 8px">No pitch page yet.</p>${state.commands['pitch-page'] ? `<button data-run="pitch-page" data-job="${esc(j.id)}">Generate pitch page</button>` : ''}`}</section>
        ${docs.map(f => `<section class="panel"><h3>${FILE_LABEL[f]}</h3><div class="doc" data-doc="${esc(f)}">Loading.</div>
          <div class="actions" style="margin-top:6px"><button data-copy="${esc(f)}">Copy text</button><a class="btn" href="/jobs/${esc(j.id)}/${esc(f)}" target="_blank" rel="noopener">Open</a></div></section>`).join('')}
        ${others.length ? `<section class="panel"><h3>Other files</h3>${others.map(f => `<div class="file-row"><span>${esc(f)}</span><a href="/jobs/${esc(j.id)}/${esc(f)}" target="_blank" rel="noopener">Open</a></div>`).join('')}</section>` : ''}
      </div>
    </div>`;
  document.querySelectorAll('[data-doc]').forEach(async el => {
    const res = await fetch(`/jobs/${j.id}/${el.dataset.doc}`);
    el.textContent = res.ok ? await res.text() : 'Could not read the file.';
  });
}

// ---- tasks across every lead and client -------------------------------------------------------------
function taskItems() {
  const items = [];
  state.jobs.forEach(j => {
    openTasks(j).forEach(t => items.push({kind: 'task', j, t, due: t.due}));
    if (isDue(j)) items.push({kind: 'follow', j, due: j.next_follow_up});
  });
  return items;
}
function tasksPage() {
  const items = taskItems().sort((a, b) => String(a.due || '9999').localeCompare(String(b.due || '9999')));
  const groups = [['Overdue', i => i.due && i.due < today], ['Today', i => i.due === today], ['Coming up', i => i.due && i.due > today], ['No date', i => !i.due]];
  const row = i => {
    const who = `<a href="#job/${esc(i.j.id)}">${esc(i.j.title)}</a>`;
    const kind = i.j.status === 'won' ? '<span class="kind client">Client</span>' : `<span class="kind">${esc(LABEL[i.j.status])}</span>`;
    if (i.kind === 'follow') return `<div class="task-row"><input type="checkbox" data-move="${i.j.status}" data-job="${esc(i.j.id)}" data-follow="+3d" aria-label="Followed up">
      <div>Follow up on the application<span class="job">${who}</span></div>${kind}<span class="note-sm">${esc(short(i.due))}</span></div>`;
    return `<div class="task-row"><input type="checkbox" data-task-toggle="${esc(i.j.id)}:${i.t.id}" aria-label="Done"><div>${esc(i.t.text)}<span class="job">${who}</span></div>${kind}<span class="note-sm">${i.due ? esc(short(i.due)) : ''}</span></div>`;
  };
  const html = groups.map(([name, test]) => { const list = items.filter(test); return list.length ? `<section class="task-group"><h3>${name} · ${list.length}</h3>${list.map(row).join('')}</section>` : ''; }).join('');
  return `<div class="task-page">${html || '<p class="empty">Nothing to do. Add tasks from any job or client, follow-ups land here on their own.</p>'}
    <p class="note-sm">Tasks live on a job or a client: add them in the side panel or on the full page. A ticked follow-up sets the next one three days out.</p></div>`;
}

// ---- the numbers page ------------------------------------------------------------------------------
function numbersPage() {
  const ins = state.insights, tr = state.tracker, m = state.me || {}, top = ins.funnel[0].count || 1;
  const tile = (l, v, h) => `<div class="tile"><span class="tile-lbl">${l}</span><span class="tile-val${v == null ? ' empty' : ''}">${v == null ? '–' : esc(v)}</span><span class="tile-hint">${esc(h)}</span></div>`;
  let prev = null;
  const rows = ins.funnel.map(f => {
    const of = prev && f.count ? ` · ${Math.round(100 * f.count / prev)}% of the step before` : '';
    prev = f.count;
    return `<div class="funnel-row"><span>${f.stage}</span><span class="track"><span style="width:${f.count ? Math.max(3, 100 * f.count / top) : 0}%"></span></span><b>${f.count}</b><span class="funnel-pct">${f.count ? Math.round(100 * f.count / top) + '%' : ''}${of}</span></div>`;
  }).join('');
  const names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const week = tr.goal ? `<h3 class="section-title">This week</h3><div class="days">${tr.week.map((d, i) => `<div class="daybar${d.count >= tr.goal ? ' hit' : ''}" title="${esc(d.day)}: ${d.count}"><span style="height:${d.future ? 0 : Math.max(3, Math.min(100, 100 * d.count / tr.goal))}%"></span><em>${names[i]}</em></div>`).join('')}</div>` : '';
  const stats = [[m.jss != null ? m.jss + '%' : null, 'Job Success'], [m.earned, 'earned'], [m.jobs, 'jobs done'], [m.reviews, 'reviews'], [m.rate, 'your rate']].filter(([v]) => v != null && v !== '');
  return `<div class="tiles">${tile('Reply rate', ins.reply_rate == null ? null : ins.reply_rate + '%', ins.reply_rate_hint)}
    ${tile('Time to reply', ins.reply_days == null ? null : ins.reply_days + ' days', ins.reply_days_hint)}
    ${tile('Applications per week', ins.per_week, 'average of the last four weeks')}</div>
    <div class="funnel">${rows}<p class="note-sm" style="margin:6px 0 0">Every job counts at the highest stage it ever reached, so a lost job still shows it got a reply first.</p></div>
    ${week}${stats.length ? `<h3 class="section-title">Where you stand</h3><div class="me-stats">${stats.map(([v, l]) => `<div><span class="me-val">${esc(v)}</span><span class="me-lbl">${l}</span></div>`).join('')}</div>` : ''}`;
}

// ---- runs: a button starts a local Claude run, the panel shows what it does -------------------------
function attachRun(id, command, job, started) {
  if (runSource) runSource.close();
  const panel = $('run'), log = $('runLog');
  $('runTitle').textContent = '/' + command + (job ? ' · ' + ((state.jobs.find(j => j.id === job) || {}).title || job) : '');
  $('runStatus').textContent = 'Starting Claude. A search takes a few minutes, you can keep working.';
  log.innerHTML = ''; panel.classList.remove('finished', 'failed'); panel.classList.add('open');
  const t0 = started ? started * 1000 : Date.now();
  clearInterval(panel._clock);
  panel._clock = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000); $('runClock').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 1000);
  const src = runSource = new EventSource('/api/run/' + id);
  src.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.kind === 'status') { $('runStatus').textContent = 'Thinking.'; return; }
    const p = document.createElement('div');
    p.className = ev.kind;
    if (ev.kind === 'tool') {
      const word = TOOL_WORDS[ev.text] || ev.text.replace(/^mcp__upwork__upwork__/, 'Upwork: ');
      $('runStatus').textContent = word + (ev.detail ? ` · ${ev.detail.split('/').pop().slice(0, 70)}` : '');
      p.textContent = '→ ' + word + (ev.detail ? ` · ${ev.detail.slice(0, 90)}` : '');
    } else p.textContent = ev.text;
    log.appendChild(p); log.scrollTop = log.scrollHeight;
    if (ev.kind === 'done') {
      src.close(); runSource = null; clearInterval(panel._clock);
      panel.classList.add(ev.error ? 'failed' : 'finished');
      $('runStatus').textContent = ev.error ? 'Stopped with an error. The last lines say why.' : 'Finished. The list is up to date.';
      toast(ev.error ? 'The run stopped with an error.' : 'Run finished.');
      load();
    }
  };
  src.onerror = () => { src.close(); };
}
function runCommand(command, job) {
  api('/api/run', {command, job}).then(r => {
    if (!r.ok) return toast(r.data.error || 'Could not start it.');
    attachRun(r.data.run, command, job);
  });
}
async function resumeRuns() {
  const r = await api('/api/runs');
  if (r.ok && r.data.length) { const x = r.data[r.data.length - 1]; attachRun(x.id, x.command, x.job, x.started); }
}

// ---- changing things ---------------------------------------------------------------------------------
async function post(path, body) {
  const r = await api(path, body);
  toast(r.ok ? r.data.message : (r.data.error || r.data.message || 'That did not work.'));
  await load();
  return r.ok;
}
const move = (id, status, follow, note) => post('/api/status', Object.assign({id, status}, follow ? {follow_up: follow} : {}, note ? {note} : {}));

const on = (sel, fn) => [sel, fn];
const CLICKS = [
  on('[data-close-drawer]', () => closeDrawer()),
  on('[data-menu]', el => { menu = menu === el.dataset.menu ? null : el.dataset.menu; colFilter = null; $('colpop').hidden = true; refreshMenus(); }),
  on('[data-layout]', el => { S().view.layout = el.dataset.layout; menu = null; saveSpaces(); route(); }),
  on('[data-apply-view]', el => {
    const [kind, i] = el.dataset.applyView.split(':'), st = S();
    st.view = clone(kind === 'preset' ? SPACES[space].presets[i] : st.saved[i]); menu = null; saveSpaces(); route();
  }),
  on('[data-delete-view]', el => { const st = S(); st.saved.splice(Number(el.dataset.deleteView), 1); commit(); }),
  on('[data-save-view]', () => {
    const name = $('viewName').value.trim(); if (!name) return $('viewName').focus();
    const st = S(); st.view.name = name; st.saved = st.saved.filter(x => x.name !== name).concat(clone(st.view)); menu = null; commit(); toast(`View "${name}" saved.`);
  }),
  on('[data-drop-filter]', el => { delete S().view.filters[el.dataset.dropFilter]; commit(); }),
  on('[data-clear-filters]', () => { S().view.filters = {}; commit(); }),
  on('[data-open-colfilter]', el => openColPop(el.dataset.openColfilter, el)),
  on('[data-colfilter-clear]', () => { delete S().view.filters[colFilter]; commit(); }),
  on('[data-colfilter-done]', () => closePops()),
  on('[data-toggle-col]', el => {
    const v = S().view, id = el.dataset.toggleCol;
    v.cols = v.cols.includes(id) ? v.cols.filter(c => c !== id) : [...v.cols, id]; commit();
  }),
  on('[data-reset-cols]', () => { const v = S().view, src = viewSource(S()) || SPACES[space].presets[0]; v.cols = clone(src.cols); v.widths = {}; commit(); }),
  on('[data-sort]', el => {
    const v = S().view, id = el.dataset.sort, first = !COLS[id].asc;
    if (!v.sort || v.sort.id !== id) v.sort = {id, desc: first};
    else if (v.sort.desc === first) v.sort = {id, desc: !first};
    else v.sort = null;
    commit();
  }),
  on('#findJobs', () => runCommand('find-jobs')),
  on('#runClose', () => $('run').classList.remove('open')),
  on('[data-run]', el => runCommand(el.dataset.run, el.dataset.job)),
  on('[data-move]', el => move(el.dataset.job, el.dataset.move, el.dataset.follow)),
  on('[data-skip]', el => { const box = $('reason-' + el.dataset.skip); box.classList.add('open'); box.querySelector('input').focus(); }),
  on('[data-confirm-skip]', el => { const note = document.querySelector(`#reason-${el.dataset.confirmSkip} input`).value.trim(); move(el.dataset.confirmSkip, 'skipped', null, note ? 'not a fit: ' + note : 'not a fit'); }),
  on('[data-convo]', el => { convoTab = el.dataset.convo; document.querySelectorAll('[data-convo]').forEach(b => b.setAttribute('aria-pressed', b === el)); $('convoBody').innerHTML = convoTab === 'timeline' ? timeline(current) : conversation(current); }),
  on('[data-note]', el => { const t = $('noteText').value.trim(); if (!t) return $('noteText').focus(); post('/api/note', {id: el.dataset.note, text: t}); }),
  on('[data-video]', el => { const u = $('videoUrl').value.trim(); if (!u) return $('videoUrl').focus(); post('/api/video', {id: el.dataset.video, url: u}); }),
  on('[data-video-clear]', el => post('/api/video', {id: el.dataset.videoClear, url: '-'})),
  on('[data-follow-save]', el => { const v = $('followDate').value; if (!v) return toast('Pick a date first.'); move(el.dataset.followSave, current.status, v); }),
  on('[data-task-add]', el => {
    const id = el.dataset.taskAdd, text = $('taskText-' + id).value.trim(), due = $('taskDue-' + id).value;
    if (!text) return $('taskText-' + id).focus();
    post('/api/task', Object.assign({id, action: 'add', text}, due ? {due} : {}));
  }),
  on('[data-copy]', el => { const doc = document.querySelector(`[data-doc="${el.dataset.copy}"]`); navigator.clipboard.writeText(doc.textContent).then(() => toast('Copied.'), () => toast('Copy was blocked, select the text instead.')); }),
];

document.addEventListener('click', e => {
  if (e.target.closest('[data-drop-filter]')) { e.stopPropagation(); return CLICKS.find(([s]) => s === '[data-drop-filter]')[1](e.target.closest('[data-drop-filter]')); }
  for (const [sel, fn] of CLICKS) { const el = e.target.closest(sel); if (el) { if (el.tagName === 'A' && !el.target) e.preventDefault(); return fn(el, e); } }
  const row = e.target.closest('[data-open]');
  if (row && !e.target.closest('a, button, select, input, label')) return drawerId === row.dataset.open ? closeDrawer() : openDrawer(row.dataset.open);
  if (!e.target.closest('.menu, #colpop')) closePops();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.stageFor) { const s = t.value; return move(t.dataset.stageFor, s, s === 'applied' ? '+3d' : null, s === 'skipped' ? 'not a fit' : null); }
  if (t.dataset.taskToggle) { const [id, n] = t.dataset.taskToggle.split(':'); return post('/api/task', {id, action: t.checked ? 'done' : 'reopen', task: n}); }
  if (t.dataset.colfilterOpt !== undefined) {
    const v = S().view, f = v.filters[colFilter] || {kind: 'multi', values: []};
    f.values = t.checked ? [...new Set([...f.values, t.dataset.colfilterOpt])] : f.values.filter(x => x !== t.dataset.colfilterOpt);
    v.filters[colFilter] = f; return commit();
  }
  if (t.dataset.range) {
    const v = S().view, f = v.filters[colFilter] || {kind: 'range', min: null, max: null};
    f[t.dataset.range] = t.value === '' ? null : Number(t.value); v.filters[colFilter] = f; return commit();
  }
});
document.addEventListener('input', e => { if (e.target.id === 'search') { S().view.query = e.target.value.trim(); saveSpaces(); $('results').innerHTML = results(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (colFilter || menu) return closePops(); if (drawerId) return closeDrawer(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.open && e.target.tagName !== 'INPUT') { e.preventDefault(); openDrawer(e.target.dataset.open); }
  if (e.key === 'Enter' && e.target.id === 'noteText') document.querySelector('[data-note]').click();
  if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('taskText-')) document.querySelector(`[data-task-add="${e.target.id.slice(9)}"]`).click();
  if (e.key === 'Enter' && e.target.id === 'viewName') document.querySelector('[data-save-view]').click();
});

// Drag: board cards onto a stage, table headers onto another position.
let dragCol = null, resizing = null;
document.addEventListener('dragstart', e => {
  if (resizing) return e.preventDefault();
  const th = e.target.closest && e.target.closest('th[data-col]');
  if (th) { dragCol = th.dataset.col; e.dataTransfer.setData('text/col', dragCol); e.dataTransfer.effectAllowed = 'move'; return; }
  const c = e.target.closest && e.target.closest('[data-drag]');
  if (c) e.dataTransfer.setData('text/plain', c.dataset.drag);
});
document.addEventListener('dragover', e => {
  const th = e.target.closest && e.target.closest('th[data-col]');
  if (th && dragCol && th.dataset.col !== dragCol) {
    e.preventDefault();
    const cols = S().view.cols, after = cols.indexOf(dragCol) < cols.indexOf(th.dataset.col);
    document.querySelectorAll('th.drop-before, th.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
    th.classList.add(after ? 'drop-after' : 'drop-before'); return;
  }
  const col = e.target.closest && e.target.closest('[data-drop]');
  if (col && !dragCol) { e.preventDefault(); col.classList.add('drop'); }
});
document.addEventListener('dragleave', e => { const col = e.target.closest && e.target.closest('[data-drop]'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('drop'); });
document.addEventListener('dragend', () => { dragCol = null; document.querySelectorAll('th.drop-before, th.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after')); });
document.addEventListener('drop', e => {
  const th = e.target.closest && e.target.closest('th[data-col]');
  if (th && dragCol) {
    e.preventDefault();
    const v = S().view, from = v.cols.indexOf(dragCol);
    v.cols.splice(from, 1);
    const to = v.cols.indexOf(th.dataset.col) + (from <= v.cols.indexOf(th.dataset.col) ? 1 : 0);
    v.cols.splice(to, 0, dragCol); dragCol = null; return commit();
  }
  const col = e.target.closest && e.target.closest('[data-drop]');
  if (!col) return;
  e.preventDefault(); col.classList.remove('drop');
  const id = e.dataTransfer.getData('text/plain'), job = state.jobs.find(j => j.id === id);
  if (job && job.status !== col.dataset.drop) move(id, col.dataset.drop, col.dataset.drop === 'applied' ? '+3d' : null);
});
// Resize: drag the right edge of a header.
document.addEventListener('pointerdown', e => {
  const grip = e.target.closest && e.target.closest('[data-grip]');
  if (!grip) return;
  e.preventDefault(); e.stopPropagation();
  const th = grip.closest('th');
  resizing = {id: grip.dataset.grip, x: e.clientX, w: th.getBoundingClientRect().width, grip};
  grip.classList.add('active'); grip.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', e => {
  if (!resizing) return;
  const w = Math.max(56, Math.min(720, Math.round(resizing.w + e.clientX - resizing.x)));
  resizing.now = w;
  const col = document.querySelector(`col[data-colw="${resizing.id}"]`);
  if (col) col.style.width = w + 'px';
});
document.addEventListener('pointerup', () => {
  if (!resizing) return;
  resizing.grip.classList.remove('active');
  if (resizing.now) { S().view.widths[resizing.id] = resizing.now; saveSpaces(); const v = S().view; $('table').style.minWidth = v.cols.reduce((s, id) => s + (v.widths[id] || COLS[id].w), 0) + 'px'; refreshMenus(); }
  setTimeout(() => { resizing = null; }, 0);
});

window.addEventListener('hashchange', route);
load().then(resumeRuns);
setInterval(() => {
  const busy = current || colFilter || menu || drawerId || resizing || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
  if (!busy) load();
}, 15000);
</script>
