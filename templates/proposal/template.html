<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ece5d7; --paper: #fbf9f4; --ink: #1c1712; --text: #2a231b; --muted: #6f6656;
    --faint: #9a9081; --accent: #c1663e; --rule: #e6ded0; --open: #b08968;
    --screen: #231d17; --screen-text: #f6f1e7; --screen-muted: #b7ab98;
    /* The house font stack, as in website/app/tokens.css. */
    --display: "Tiempos Text", Georgia, "Iowan Old Style", "Times New Roman", ui-serif, serif;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); padding: 24px 12px 56px;
         font: 13px/1.5 var(--sans);
         -webkit-font-smoothing: antialiased; }
  p { margin: 0; }

  /* One page. If the content runs past it, the content gets cut, not the page made longer. */
  .sheet { width: 210mm; min-height: 297mm; max-width: 100%; margin: 0 auto; background: var(--paper);
           box-shadow: 0 20px 54px rgba(28,23,18,.12); padding: 18mm 20mm 14mm;
           display: flex; flex-direction: column; }

  .head { border-bottom: 1.5px solid var(--ink); padding-bottom: 4mm; margin-bottom: 7mm; }
  h1 { font-family: var(--display); font-weight: 500;
       color: var(--ink); font-size: 26px; line-height: 1.15; margin: 0 0 1.5mm; }
  .sub { color: var(--muted); font-size: 11.5px; }

  /* The video goes first: it is the part the client actually takes in. */
  .video { position: relative; display: flex; align-items: center; gap: 6mm; overflow: hidden;
           background: var(--screen); color: var(--screen-text); text-decoration: none;
           border-radius: 2.5mm; padding: 7mm 8mm; margin-bottom: 7mm; min-height: 34mm;
           box-shadow: 0 0 0 1.2mm rgba(193,102,62,.16); }
  .video .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
                   opacity: .22; filter: grayscale(.3); }
  .video > *:not(.poster) { position: relative; }
  .play { width: 15mm; height: 15mm; border-radius: 50%; background: var(--accent); flex: none;
          display: grid; place-items: center; }
  .play::before { content: ""; margin-left: 1.2mm; border-style: solid; border-color: transparent;
                  border-left-color: #fff; border-width: 2.6mm 0 2.6mm 4.2mm; }
  .video b { display: block; font-size: 15px; font-weight: 600; margin-bottom: 1mm; }
  .video span { font-size: 11.5px; color: var(--screen-muted); }
  .video .len { position: absolute; right: 5mm; bottom: 4mm; font: 600 10.5px/1 var(--mono);
                color: var(--screen-muted); }
  .video .missing { color: #d9b48f; }

  /* Eight short parts, one rhythm: a small label, one line under it. */
  .parts { flex: 1; }
  .part { display: grid; grid-template-columns: 34mm 1fr; gap: 6mm; align-items: baseline;
          padding: 3.4mm 0; border-top: 1px solid var(--rule); }
  .part:first-child { border-top: 0; padding-top: 0; }
  .part .k { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint);
             font-weight: 600; }
  .part .v { font-size: 13px; color: var(--ink); line-height: 1.45; }
  .part .v small { display: block; font-size: 11px; color: var(--muted); margin-top: .8mm; }
  .part ol { margin: 0; padding-left: 4.5mm; }
  .part ol li { padding-left: 1mm; }
  .part ol li + li { margin-top: .8mm; }
  .part.cost .v strong { font-family: var(--display); font-weight: 500; font-size: 15px;
                         font-variant-numeric: tabular-nums; }

  .foot { border-top: 1px solid var(--rule); padding-top: 5mm; margin-top: 4mm; display: flex;
          justify-content: space-between; align-items: flex-end; gap: 10mm; }
  .fine { font-size: 9.5px; color: var(--faint); }
  .fine p { margin: 0 0 1mm; }
  .cta { background: var(--accent); color: #fff; text-decoration: none; padding: 3mm 6mm;
         border-radius: 2mm; font-size: 12px; font-weight: 600; white-space: nowrap; }

  .missing { color: var(--open); font-style: italic; }

  @media (max-width: 800px) {
    body { padding: 10px 8px 36px; }
    .sheet { padding: 9mm 6mm; min-height: 0; }
    .video { padding: 6mm 5mm 9mm; gap: 4mm; }
    .play { width: 12mm; height: 12mm; }
    .part { grid-template-columns: 1fr; gap: 1mm; }
    .foot { flex-direction: column; align-items: flex-start; gap: 5mm; }
  }
  @media print {
    body { padding: 0; background: #fff; }
    .sheet { box-shadow: none; width: auto; min-height: 0; padding: 0; }
    .video { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: A4 portrait; margin: 14mm; }
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="head">
    <h1>{{HEADLINE}}</h1>
    <p class="sub">Proposal for {{CLIENT}} · {{DATE}}</p>
  </div>

  {{VIDEO}}

  <div class="parts">
    <div class="part"><p class="k">{{L_PROBLEM}}</p><div class="v">{{PROBLEM}}</div></div>
    <div class="part"><p class="k">{{L_DELIVERABLE}}</p><div class="v">{{DELIVERABLE}}</div></div>
    <div class="part"><p class="k">{{L_WORTH}}</p><div class="v">{{WORTH}}</div></div>
    <div class="part"><p class="k">{{L_TIMELINE}}</p><div class="v">{{TIMELINE}}</div></div>
    <div class="part cost"><p class="k">{{L_COST}}</p><div class="v">{{COST}}</div></div>
    <div class="part"><p class="k">{{L_TOOLS}}</p><div class="v">{{TOOLS}}</div></div>
    <div class="part"><p class="k">{{L_PROOF}}</p><div class="v">{{PROOF}}</div></div>
    <div class="part"><p class="k">{{L_NEXT}}</p><div class="v">{{NEXT}}</div></div>
  </div>

  <div class="foot">
    <div class="fine">{{MEMBER}}<br>{{FINE}}</div>
    <a class="cta" href="{{CTA_HREF}}">{{CTA}}</a>
  </div>

</div>
</body>
</html>
